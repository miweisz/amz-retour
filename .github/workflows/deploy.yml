name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo -u antoine bash -c '
              cd /home/antoine/amz-retour
              git pull origin main
              npm install
              rm -rf .next
              npm run build
              mkdir -p .next/standalone/amz-retour
              find .next/standalone -maxdepth 1 -mindepth 1 ! -name amz-retour -exec mv {} .next/standalone/amz-retour/ \;
              cp -r .next/static .next/standalone/amz-retour/.next/static
              cp -r public .next/standalone/amz-retour/public 2>/dev/null || true
              ln -sfn /home/antoine/amz-retour/data /home/antoine/amz-retour/.next/standalone/amz-retour/data
            '
            sudo systemctl restart amz-retour
